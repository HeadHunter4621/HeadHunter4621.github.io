# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Kouga-P's Site
# email: your-email@example.com
description: >- # this means to ignore newlines until "baseurl:"
  Website where KougaP shares news and distributes voicebanks & reclists
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://HeadHunter4621.github.io/" # the base hostname & protocol for your site, e.g. http://example.com
github_username: HeadHunter4621

# Build settings
remote_theme: "mmistakes/minimal-mistakes@4.27.3"
minimal_mistakes_skin: "dark"
plugins:
  - jekyll-feed
  - jekyll-remote-theme
  - jekyll-include-cache

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
defaults:
  - scope: # _posts
      path: ""
      type: posts
    values:
      layout: single
      read_time: true
      comments: false
      share: false
      related: false
      classes: wide
      author_profile: true
  - scope: # _pages
      path: ""
      type: pages
    values:
      layout: single
      read_time: false
      comments: false
      share: false
      related: false
      classes: wide
      author_profile: true

author:
  name: "Kouga-P"
  avatar: "/assets/profile-photo.png"
  bio: "I'm an UTAU producer who makes lots of voicebanks! You can find me on Discord as @hh4621 or send me an email at [kouga-p@proton.me]()" # Note: Markdown is allowed
  links:
    - label: "YouTube"
      icon: "fa-brands fa-youtube"
      url: "https://www.youtube.com/@KougaP"
    - label: "Instagram"
      icon: "fa-brands fa-instagram"
      url: "https://www.instagram.com/_kouga_p/reels/"
    - label: "Email"
      icon: "fa-solid fa-envelope-open"
      url: "mailto:kouga-p@proton.me"
    - label: "VocaDB Artist Page"
      icon: "fa-solid fa-globe"
      url: "https://vocadb.net/Ar/176210"

footer:
  links:
    - label: "Issues or Questions? Send an email!"
      icon: "fa-solid fa-envelope-open"
      url: "mailto:kouga-p@proton.me"

include: ["_pages"]
